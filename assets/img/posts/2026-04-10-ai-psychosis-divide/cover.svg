      <path d="M38 238l15-20 14 8 11-32 10 44" fill="none" stroke="#818892" stroke-width="3" />
      <rect x="112" y="180" width="98" height="76" fill="#eef2f5" stroke="#c9d0d6" stroke-width="2" />
