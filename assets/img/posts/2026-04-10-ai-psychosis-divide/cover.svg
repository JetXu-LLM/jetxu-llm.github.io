    <path d="M1165 230L1025 320" />
    <path d="M1165 230L1305 308" />
    <path d="M1025 320L945 470" />
    <path d="M1025 320L1140 430" />
    <path d="M1305 308L1210 460" />
    <path d="M945 470L1060 612" />
    <path d="M1140 430L1215 608" />
    <path d="M1210 460L1360 558" />
