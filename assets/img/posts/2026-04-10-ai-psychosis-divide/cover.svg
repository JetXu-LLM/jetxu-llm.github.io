    <g transform="translate(955 275) scale(0.82)">
      <polygon points="0,0 75,-35 150,0 75,35" fill="#c0c7cf" />
      <polygon points="0,0 75,35 75,125 0,88" fill="#273038" />
      <polygon points="150,0 75,35 75,125 150,88" fill="url(#cube)" />
    </g>
    <g transform="translate(1260 265) scale(0.72)">
