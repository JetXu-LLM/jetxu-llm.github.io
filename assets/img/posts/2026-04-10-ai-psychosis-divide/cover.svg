    <path d="M930 170h520" />
    <path d="M840 260h190" />
    <path d="M1010 340h420" />
    <path d="M900 520h560" />
    <path d="M850 640h260" />
    <path d="M970 770h420" />
    <path d="M1120 110v680" />
    <path d="M1295 60v660" />
