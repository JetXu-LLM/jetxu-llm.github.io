<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Split cover showing office-file chaos and compiled knowledge structure</title>
  <desc id="desc">The left half shows stacks of folders and documents. The right half shows connected dark cubes in a structured graph.</desc>
  <defs>
    <linearGradient id="bgLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f7f4" />
      <stop offset="100%" stop-color="#d9dcd8" />
    </linearGradient>
    <linearGradient id="bgRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d2227" />
      <stop offset="100%" stop-color="#0c1014" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e9edf0" />
    </linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#757d87" />
      <stop offset="100%" stop-color="#20262c" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="800" height="900" fill="url(#bgLeft)" />
  <rect x="800" width="800" height="900" fill="url(#bgRight)" />
  <rect x="790" width="20" height="900" fill="#c5c9ce" opacity="0.55" />

  <g opacity="0.25" stroke="#2a2f35" stroke-width="2">
    <path d="M70 110h220" />
    <path d="M120 165h320" />
    <path d="M85 250h170" />
    <path d="M200 320h260" />
    <path d="M110 740h310" />
    <path d="M300 800h160" />
  </g>

  <g filter="url(#softShadow)">
    <rect x="170" y="460" width="210" height="190" rx="10" fill="#dce3e9" stroke="#aeb6bd" stroke-width="3" />
    <path d="M195 430h78l24 30H195z" fill="#c7d1d9" stroke="#aeb6bd" stroke-width="3" />
    <rect x="225" y="390" width="210" height="190" rx="10" fill="#e4e9ed" stroke="#aeb6bd" stroke-width="3" />
    <path d="M250 360h78l24 30H250z" fill="#d0d8df" stroke="#aeb6bd" stroke-width="3" />
    <rect x="295" y="345" width="240" height="215" rx="10" fill="#edf1f4" stroke="#b9c0c7" stroke-width="3" />
    <path d="M320 314h92l28 31H320z" fill="#dbe2e7" stroke="#b9c0c7" stroke-width="3" />
  </g>

  <g filter="url(#glow)">
    <g transform="translate(420 195) rotate(-11)">
      <rect x="0" y="0" width="238" height="310" rx="8" fill="url(#paper)" stroke="#bdc3ca" stroke-width="2" />
      <path d="M28 46h150" stroke="#6b7280" stroke-width="6" />
      <path d="M28 72h182" stroke="#6b7280" stroke-width="4" />
      <path d="M28 103h182" stroke="#c4c9cf" stroke-width="3" />
      <path d="M28 125h182" stroke="#c4c9cf" stroke-width="3" />
