      <polygon points="0,0 75,35 75,125 0,88" fill="#2d353d" />
      <polygon points="150,0 75,35 75,125 150,88" fill="url(#cube)" />
    </g>
    <g transform="translate(900 420) scale(0.94)">
      <polygon points="0,0 75,-35 150,0 75,35" fill="#d5dbe1" />
      <polygon points="0,0 75,35 75,125 0,88" fill="#2b3138" />
      <polygon points="150,0 75,35 75,125 150,88" fill="url(#cube)" />
    </g>
    <g transform="translate(1100 394) scale(0.78)">
      <polygon points="0,0 75,-35 150,0 75,35" fill="#c8d0d7" />
      <polygon points="0,0 75,35 75,125 0,88" fill="#2a3037" />
      <polygon points="150,0 75,35 75,125 150,88" fill="url(#cube)" />
    </g>
    <g transform="translate(1178 570) scale(0.9)">
      <polygon points="0,0 75,-35 150,0 75,35" fill="#d0d7de" />
      <polygon points="0,0 75,35 75,125 0,88" fill="#2a3138" />
      <polygon points="150,0 75,35 75,125 150,88" fill="url(#cube)" />
    </g>
    <g transform="translate(1330 675) scale(0.72)">
      <polygon points="0,0 75,-35 150,0 75,35" fill="#cbd2d8" />
      <polygon points="0,0 75,35 75,125 0,88" fill="#273038" />
      <polygon points="150,0 75,35 75,125 150,88" fill="url(#cube)" />
    </g>
    <g transform="translate(1005 695) scale(0.78)">
      <polygon points="0,0 75,-35 150,0 75,35" fill="#d6dce2" />
      <polygon points="0,0 75,35 75,125 0,88" fill="#2a3037" />
      <polygon points="150,0 75,35 75,125 150,88" fill="url(#cube)" />
    </g>
  </g>

  <g fill="#f6fafc">
    <circle cx="1158" cy="194" r="5" />
    <circle cx="1014" cy="318" r="5" />
    <circle cx="945" cy="470" r="5" />
    <circle cx="1138" cy="430" r="5" />
    <circle cx="1304" cy="308" r="5" />
    <circle cx="1210" cy="460" r="5" />
    <circle cx="1059" cy="612" r="5" />
