<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The context gap between codebases and office files</title>
  <desc id="desc">A side-by-side diagram showing why AI works better with a full code repository than with fragmented office documents.</desc>
  <defs>
    <linearGradient id="leftBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafb" />
      <stop offset="100%" stop-color="#edf1f4" />
    </linearGradient>
    <linearGradient id="rightBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafafa" />
      <stop offset="100%" stop-color="#f0f2f4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#f7f8fa" />
  <text x="600" y="58" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#121826" text-anchor="middle">Why AI feels stronger in code than in office work</text>
  <text x="600" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#586174" text-anchor="middle">The gap is usually not model intelligence. It is the quality of the working context.</text>

  <g transform="translate(70 140)" filter="url(#shadow)">
    <rect width="480" height="470" rx="18" fill="url(#leftBg)" stroke="#d9dee5" stroke-width="2" />
    <text x="240" y="42" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#101828" text-anchor="middle">Programmer workflow</text>
    <text x="240" y="72" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#667085" text-anchor="middle">Repository, terminal, tests, repeatable feedback</text>

    <rect x="172" y="118" width="136" height="44" rx="10" fill="#111827" />
    <text x="240" y="146" font-family="Menlo, Monaco, monospace" font-size="16" fill="#ffffff" text-anchor="middle">repo/</text>

    <path d="M240 162L140 232" stroke="#1f2937" stroke-width="3" />
    <path d="M240 162L240 232" stroke="#1f2937" stroke-width="3" />
    <path d="M240 162L340 232" stroke="#1f2937" stroke-width="3" />

    <rect x="84" y="232" width="112" height="42" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2" />
    <text x="140" y="258" font-family="Menlo, Monaco, monospace" font-size="15" fill="#111827" text-anchor="middle">tests/</text>

    <rect x="184" y="232" width="112" height="42" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2" />
    <text x="240" y="258" font-family="Menlo, Monaco, monospace" font-size="15" fill="#111827" text-anchor="middle">docs/</text>

    <rect x="284" y="232" width="112" height="42" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2" />
    <text x="340" y="258" font-family="Menlo, Monaco, monospace" font-size="15" fill="#111827" text-anchor="middle">src/</text>

    <rect x="110" y="332" width="260" height="96" rx="18" fill="#111827" />
    <text x="240" y="367" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">AI agent</text>
    <text x="240" y="398" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#d2d8df" text-anchor="middle">Can inspect, modify, run, verify</text>

    <path d="M240 274L240 332" stroke="#111827" stroke-width="4" stroke-dasharray="8 8" />

    <rect x="86" y="448" width="308" height="104" rx="16" fill="#ffffff" stroke="#d0d5dd" stroke-width="2" />
    <text x="240" y="484" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">Result</text>
    <text x="240" y="514" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#475467" text-anchor="middle">Durable context, explicit checks, iterative repair</text>
    <text x="240" y="539" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#475467" text-anchor="middle">The system can build on previous work</text>
  </g>

  <g transform="translate(650 140)" filter="url(#shadow)">
    <rect width="480" height="470" rx="18" fill="url(#rightBg)" stroke="#d9dee5" stroke-width="2" />
    <text x="240" y="42" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#101828" text-anchor="middle">Typical office workflow</text>
    <text x="240" y="72" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#667085" text-anchor="middle">Decks, spreadsheets, PDFs, email threads, copy-paste prompts</text>

    <g transform="translate(55 120)">
      <rect x="0" y="0" width="104" height="64" rx="10" fill="#ffffff" stroke="#98a2b3" stroke-width="2" />
      <text x="52" y="37" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#344054" text-anchor="middle">Deck.pptx</text>

      <rect x="265" y="8" width="118" height="64" rx="10" fill="#ffffff" stroke="#98a2b3" stroke-width="2" />
      <text x="324" y="45" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#344054" text-anchor="middle">Model.xlsx</text>

      <rect x="146" y="108" width="118" height="64" rx="10" fill="#ffffff" stroke="#98a2b3" stroke-width="2" />
      <text x="205" y="145" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#344054" text-anchor="middle">Memo.pdf</text>

      <rect x="30" y="208" width="124" height="64" rx="10" fill="#ffffff" stroke="#98a2b3" stroke-width="2" />
      <text x="92" y="245" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#344054" text-anchor="middle">Email.eml</text>

      <rect x="282" y="208" width="124" height="64" rx="10" fill="#ffffff" stroke="#98a2b3" stroke-width="2" />
      <text x="344" y="245" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#344054" text-anchor="middle">Notes.docx</text>

      <circle cx="214" cy="336" r="48" fill="#111827" />
      <text x="214" y="344" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">AI</text>

      <path d="M205 172L205 288" stroke="#98a2b3" stroke-width="3" stroke-dasharray="8 8" />
      <path d="M92 272L165 316" stroke="#98a2b3" stroke-width="3" stroke-dasharray="8 8" />
      <path d="M344 272L260 316" stroke="#98a2b3" stroke-width="3" stroke-dasharray="8 8" />
      <path d="M105 64L180 120" stroke="#98a2b3" stroke-width="3" stroke-dasharray="8 8" />
      <path d="M324 72L238 120" stroke="#98a2b3" stroke-width="3" stroke-dasharray="8 8" />
    </g>

    <rect x="86" y="448" width="308" height="104" rx="16" fill="#ffffff" stroke="#d0d5dd" stroke-width="2" />
    <text x="240" y="484" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">Result</text>
    <text x="240" y="514" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#475467" text-anchor="middle">Partial context, weak memory, frequent re-explaining</text>
    <text x="240" y="539" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#475467" text-anchor="middle">The system sees only what was pasted this time</text>
  </g>

  <rect x="250" y="640" width="700" height="44" rx="22" fill="#111827" />
  <text x="600" y="668" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">The next step for knowledge work is not a better chat box. It is maintained context.</text>
</svg>