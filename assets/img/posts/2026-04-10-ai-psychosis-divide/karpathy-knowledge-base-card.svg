<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Quote card about LLM knowledge bases</title>
  <desc id="desc">A light editorial quote card summarizing Karpathy's knowledge compilation idea from the LLM Wiki gist.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafb" />
      <stop offset="100%" stop-color="#edf1f4" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="84" y="82" width="420" height="468" rx="22" fill="#111827" />
  <text x="130" y="166" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">LLM Wiki</text>
  <text x="130" y="204" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#c7d0d9">Karpathy's April 5 idea file</text>
  <path d="M130 250h200" stroke="#c7d0d9" stroke-width="4" />
  <path d="M130 288h274" stroke="#c7d0d9" stroke-width="4" opacity="0.7" />
  <path d="M130 326h252" stroke="#c7d0d9" stroke-width="4" opacity="0.55" />
  <path d="M130 390h304" stroke="#5eead4" stroke-width="7" opacity="0.9" />
  <path d="M130 430h276" stroke="#c7d0d9" stroke-width="4" opacity="0.7" />
  <path d="M130 468h188" stroke="#c7d0d9" stroke-width="4" opacity="0.55" />

  <text x="574" y="205" font-family="Georgia, Times New Roman, serif" font-size="50" fill="#111827">"The knowledge is compiled once</text>
  <text x="574" y="267" font-family="Georgia, Times New Roman, serif" font-size="50" fill="#111827">and then kept current, not</text>
  <text x="574" y="329" font-family="Georgia, Times New Roman, serif" font-size="50" fill="#111827">re-derived on every query."</text>

  <line x1="574" y1="392" x2="1060" y2="392" stroke="#c5ccd4" stroke-width="2" />
  <text x="574" y="454" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#475467">Why it matters</text>
  <text x="574" y="492" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#111827">This turns AI from a one-shot retriever into a maintained memory system.</text>
</svg>