<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Quote card about the AI capability gap</title>
  <desc id="desc">A dark editorial quote card summarizing Karpathy's point about the gap in understanding of AI capability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12161b" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="145" cy="118" r="36" fill="#d9dde1" />
  <text x="205" y="108" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Andrej Karpathy</text>
  <text x="205" y="142" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#98a2b3">April 2026 on the AI capability gap</text>

  <text x="106" y="245" font-family="Georgia, Times New Roman, serif" font-size="58" fill="#ffffff">"There is a growing gap in understanding</text>
  <text x="106" y="315" font-family="Georgia, Times New Roman, serif" font-size="58" fill="#ffffff">of AI capability, because technical users</text>
  <text x="106" y="385" font-family="Georgia, Times New Roman, serif" font-size="58" fill="#ffffff">are experiencing a very different product."</text>

  <line x1="106" y1="468" x2="1094" y2="468" stroke="#2f3842" stroke-width="2" />
  <text x="106" y="528" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#cbd5df">Why it matters</text>
  <text x="106" y="566" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff">The disagreement is not only about models. It is about workflow, context, and feedback.</text>
</svg>